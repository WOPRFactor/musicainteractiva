# ============================================================================
# EMION · Stack completo en Docker
#   docker compose up            → levanta todo (db, redis, backend, frontend)
#   docker compose up db redis   → solo infra (útil si corrés backend/front local)
# ============================================================================

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: emion
      POSTGRES_PASSWORD: emion
      POSTGRES_DB: emion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emion"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      FLASK_CONFIG: development
      DATABASE_URL: postgresql+psycopg2://emion:emion@db:5432/emion
      REDIS_URL: redis://redis:6379/0
      RATELIMIT_STORAGE_URI: redis://redis:6379/1
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: dev-secret-cambiar
      JWT_SECRET_KEY: dev-jwt-secret-cambiar
      JWT_COOKIE_SECURE: "false"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      # El frontend habla al backend por este destino (proxy interno de Next).
      BACKEND_URL: http://backend:5000
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
